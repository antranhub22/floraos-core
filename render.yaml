# render.yaml — FloraOS Core Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ══════════════════════════════════════════════
  # 1. WEB SERVICE — Next.js App
  # ══════════════════════════════════════════════
  - type: web
    name: floraos-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run db:seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      # PO 08/10/2026: máy chủ thật SẠCH — không nạp "Tiệm Hoa Mộc Lan" mỗi lần triển khai, tiệm mới
      # không mang hồ sơ mẫu. Giữ khoá với "false" (không xoá) để Render ghi đè giá trị "true" cũ.
      - key: SEED_DEV_DATA
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      - key: SESSION_SECRET
        generateValue: true
      - key: SSO_SESSION_SECRET
        generateValue: true
      - key: INTEGRATION_TOKEN_SECRET
        generateValue: true
      # Redis dùng chung cho giới hạn tần suất endpoint công khai (Thẻ chào)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: floraos-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_VERTEX_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: SERPAPI_API_KEY
        sync: false
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_TIMEOUT_SECONDS
        value: "120"
      - key: IOPAINT_DEVICE
        value: cpu
      - key: GREETING_CARD_ENABLED
        value: "true"
      # SOCIALFLOW_URL và LOCALBUDD_URL để undefined (không set) thay vì ""
      # vì Zod schema dùng .url().optional() — chấp nhận undefined nhưng
      # reject empty string. Điền URL thật sau khi deploy SocialFlow/LocalBudd.
      # - key: SOCIALFLOW_URL
      # - key: LOCALBUDD_URL
      # - key: NEXT_PUBLIC_SOCIALFLOW_URL
      # - key: NEXT_PUBLIC_LOCALBUDD_URL

  # ══════════════════════════════════════════════
  # 2. BACKGROUND WORKER — Media AI
  # ══════════════════════════════════════════════
  - type: worker
    name: floraos-worker-media
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_DEVICE
        value: cpu

  # ══════════════════════════════════════════════
  # 3. BACKGROUND WORKER — Video AI
  # ══════════════════════════════════════════════
  - type: worker
    name: floraos-worker-video
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.video.video_worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # 4. BACKGROUND WORKER — Vision AI
  # ══════════════════════════════════════════════
  - type: worker
    name: floraos-worker-vision
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m vision.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # KEY VALUE (Redis) — bộ đếm giới hạn tần suất dùng chung các instance
  # ══════════════════════════════════════════════
  - type: keyvalue
    name: floraos-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # chỉ dịch vụ nội bộ Render truy cập

# ══════════════════════════════════════════════
# DATABASE — PostgreSQL 16
# ══════════════════════════════════════════════
databases:
  - name: floraos-postgres
    databaseName: floraos
    user: floraos
    region: singapore
    plan: basic-256mb
