# render.yaml — FloraOS Core Infrastructure as Code
# Deploy: https://dashboard.render.com/select-repo
# Docs: https://render.com/docs/infrastructure-as-code
#
# ⚠️  QUAN TRỌNG — pg_cron:
#   Render Managed PostgreSQL KHÔNG hỗ trợ shared_preload_libraries → pg_cron
#   sẽ KHÔNG hoạt động trên Render. Giải pháp:
#   1. Dùng Render Cron Job service thay thế (đã cấu hình bên dưới)
#   2. Module Market Intelligence (D-MI3) cần migration plan riêng
#
# Thứ tự khởi động: postgres → web (chạy migrate) → workers
# ─────────────────────────────────────────────────────────────

services:
  # ══════════════════════════════════════════════
  # 1. WEB SERVICE — Next.js App
  # ══════════════════════════════════════════════
  - type: web
    name: floraos-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3100"
      - key: SESSION_SECRET
        generateValue: true
      - key: SSO_SESSION_SECRET
        generateValue: true
      - key: INTEGRATION_TOKEN_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_VERTEX_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: SERPAPI_API_KEY
        sync: false
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_TIMEOUT_SECONDS
        value: "120"
      - key: IOPAINT_DEVICE
        value: cpu
      - key: GREETING_CARD_ENABLED
        value: "true"
      - key: SOCIALFLOW_URL
        value: ""
      - key: LOCALBUDD_URL
        value: ""
      - key: NEXT_PUBLIC_SOCIALFLOW_URL
        value: ""
      - key: NEXT_PUBLIC_LOCALBUDD_URL
        value: ""

  # ══════════════════════════════════════════════
  # 2. BACKGROUND WORKER — Media AI (Image Processing)
  # ══════════════════════════════════════════════
  - type: worker
    name: floraos-worker-media
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: GOOGLE_VERTEX_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_DEVICE
        value: cpu
      - key: IOPAINT_TIMEOUT_SECONDS
        value: "120"
      - key: PYTHON_VERSION
        value: "3.11"

  # ══════════════════════════════════════════════
  # 3. BACKGROUND WORKER — Video AI (Video Rendering)
  # ══════════════════════════════════════════════
  - type: worker
    name: floraos-worker-video
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.video.video_worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: PYTHON_VERSION
        value: "3.11"

  # ══════════════════════════════════════════════
  # 4. BACKGROUND WORKER — Vision AI (Product Recognition)
  # ══════════════════════════════════════════════
  - type: worker
    name: floraos-worker-vision
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m vision.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: PYTHON_VERSION
        value: "3.11"

  # ══════════════════════════════════════════════
  # 5. CRON JOB — Market Intelligence Scheduler
  #    (Thay thế pg_cron — không hỗ trợ trên Render Managed PG)
  # ══════════════════════════════════════════════
  - type: cron
    name: floraos-market-intelligence-cron
    runtime: node
    region: singapore
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker:market-intelligence
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floraos-postgres
          property: connectionString
      - key: SERPAPI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"

# ══════════════════════════════════════════════
# DATABASE — PostgreSQL 16
# ══════════════════════════════════════════════
databases:
  - name: floraos-postgres
    databaseName: floraos
    user: floraos
    region: singapore
    plan: starter
    # ⚠️ pg_cron KHÔNG hỗ trợ trên Render Managed PostgreSQL.
    # Market Intelligence cron đã được chuyển sang Render Cron Job service.
