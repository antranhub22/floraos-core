<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2185b" />
      <stop offset="100%" stop-color="#880e4f" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="400" height="480" rx="24" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" filter="url(#shadow)" />

  <!-- Header Banner -->
  <path d="M0,24 Q0,0 24,0 L376,0 Q400,0 400,24 L400,85 L0,85 Z" fill="url(#headerGrad)" />
  <text x="200" y="38" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">VIETQR • THANH TOÁN NHANH</text>
  <text x="200" y="65" text-anchor="middle" fill="#fce4ec" font-family="sans-serif" font-size="16" font-weight="600">TIỆM HOA MỘC LAN</text>

  <!-- Bank Info Bar -->
  <rect x="30" y="100" width="340" height="42" rx="10" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1" />
  <text x="45" y="126" fill="#be185d" font-family="sans-serif" font-size="13" font-weight="700">Ngân hàng:</text>
  <text x="135" y="126" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="600">Vietcombank - CN Tân Định</text>

  <!-- QR Frame -->
  <rect x="50" y="155" width="300" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- QR Matrix Mockup -->
  <!-- Corner 1 -->
  <rect x="75" y="175" width="55" height="55" rx="8" fill="#1e293b" />
  <rect x="85" y="185" width="35" height="35" rx="4" fill="#ffffff" />
  <rect x="93" y="193" width="19" height="19" rx="2" fill="#c2185b" />

  <!-- Corner 2 -->
  <rect x="270" y="175" width="55" height="55" rx="8" fill="#1e293b" />
  <rect x="280" y="185" width="35" height="35" rx="4" fill="#ffffff" />
  <rect x="288" y="193" width="19" height="19" rx="2" fill="#c2185b" />

  <!-- Corner 3 -->
  <rect x="75" y="310" width="55" height="55" rx="8" fill="#1e293b" />
  <rect x="85" y="320" width="35" height="35" rx="4" fill="#ffffff" />
  <rect x="93" y="328" width="19" height="19" rx="2" fill="#c2185b" />

  <!-- QR Data Dots Pattern -->
  <g fill="#1e293b">
    <!-- Row 1 -->
    <rect x="145" y="175" width="10" height="10" rx="2" />
    <rect x="165" y="175" width="10" height="25" rx="2" />
    <rect x="185" y="175" width="25" height="10" rx="2" />
    <rect x="220" y="175" width="10" height="10" rx="2" />
    <rect x="240" y="175" width="15" height="10" rx="2" />

    <!-- Row 2 -->
    <rect x="145" y="195" width="15" height="10" rx="2" />
    <rect x="185" y="195" width="10" height="10" rx="2" />
    <rect x="205" y="195" width="25" height="10" rx="2" />
    <rect x="245" y="195" width="10" height="20" rx="2" />

    <!-- Center Logo Badge -->
    <circle cx="200" cy="270" r="26" fill="#c2185b" stroke="#ffffff" stroke-width="4" />
    <text x="200" y="276" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="16" font-weight="bold">ML</text>

    <!-- Row 3 & 4 data dots -->
    <rect x="145" y="220" width="20" height="10" rx="2" />
    <rect x="235" y="225" width="15" height="10" rx="2" />
    <rect x="75" y="250" width="10" height="20" rx="2" />
    <rect x="95" y="250" width="15" height="10" rx="2" />
    <rect x="120" y="250" width="10" height="15" rx="2" />
    <rect x="270" y="250" width="15" height="10" rx="2" />
    <rect x="295" y="250" width="25" height="10" rx="2" />
    <rect x="310" y="270" width="15" height="10" rx="2" />

    <!-- Row 5 -->
    <rect x="145" y="315" width="15" height="15" rx="2" />
    <rect x="170" y="315" width="10" height="10" rx="2" />
    <rect x="220" y="315" width="10" height="25" rx="2" />
    <rect x="240" y="315" width="20" height="10" rx="2" />
    <rect x="270" y="315" width="10" height="10" rx="2" />
    <rect x="290" y="315" width="25" height="10" rx="2" />

    <!-- Row 6 -->
    <rect x="145" y="340" width="25" height="10" rx="2" />
    <rect x="180" y="335" width="15" height="15" rx="2" />
    <rect x="240" y="335" width="10" height="20" rx="2" />
    <rect x="260" y="340" width="25" height="10" rx="2" />
    <rect x="300" y="335" width="15" height="15" rx="2" />
  </g>

  <!-- Bottom Details -->
  <text x="200" y="415" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="700">STK: 0901 234 567</text>
  <text x="200" y="438" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Chủ TK: TIEM HOA MOC LAN • Quét mã để thanh toán</text>
  <text x="200" y="458" text-anchor="middle" fill="#c2185b" font-family="sans-serif" font-size="11" font-weight="600">Hotline / Zalo hỗ trợ: 0901 234 567</text>
</svg>
