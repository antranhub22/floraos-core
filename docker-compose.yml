services:
  db:
    image: postgres:16
    container_name: floraos-core-db
    environment:
      POSTGRES_USER: floraos
      POSTGRES_PASSWORD: floraos
      POSTGRES_DB: floraos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floraos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
